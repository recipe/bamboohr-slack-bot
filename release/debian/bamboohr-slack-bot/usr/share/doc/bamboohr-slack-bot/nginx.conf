# An example nginx server that terminates TLS for the bot, which listens on the loopback only
# (server_endpoint: "127.0.0.1:8087" in /etc/bamboohr-slack-bot/config.yml).
#
# It is not enabled by the package. To add it next to the existing sites:
#   cp /usr/share/doc/bamboohr-slack-bot/nginx.conf /etc/nginx/sites-available/bamboohr-slack-bot
#   # set server_name and the certificate paths
#   ln -s /etc/nginx/sites-available/bamboohr-slack-bot /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# The Slack app then uses https://bot.example.com/command as the slash command request URL and
# https://bot.example.com/redirect as the OAuth redirect URL. Use another port in `listen`
# (e.g. 8443) to keep the URLs of an existing installation.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.example.com;

    ssl_certificate /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Slack sends a few kilobytes; the bot refuses bodies over 64 KB.
        client_max_body_size 64k;
    }
}
